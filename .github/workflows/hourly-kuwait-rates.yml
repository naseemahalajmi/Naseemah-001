name: Hourly Kuwait rates

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the latest KWD table
        run: curl -fsS "https://open.er-api.com/v6/latest/KWD" -o apps/api/data/kuwait-rates.json
      - name: Store the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/data/kuwait-rates.json
          if git diff --staged --quiet; then
            echo "Rates snapshot unchanged."
            exit 0
          fi
          git commit -m "Refresh the stored Kuwait rates snapshot."
          git push
