services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: naseemah
      POSTGRES_PASSWORD: naseemah
      POSTGRES_DB: naseemah
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U naseemah -d naseemah"]
      interval: 3s
      timeout: 5s
      retries: 20
    ports:
      - "5432:5432"

  mail:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://naseemah:naseemah@db:5432/naseemah
      RATES_SNAPSHOT_URL: https://raw.githubusercontent.com/naseemahalajmi/Naseemah-001/main/apps/api/data/kuwait-rates.json
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      SESSION_SECRET: dev-session-secret-change-me
      PUBLIC_WEB_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      PORT: "3000"
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - api_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      API_PROXY_TARGET: http://api:3000
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - web_modules:/app/node_modules

volumes:
  postgres_data:
  api_modules:
  web_modules:
